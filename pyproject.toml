[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "workstate"
version = "4.1.1"
description = "Local Windows activity tracking and reports; successor to PCState"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pywebview>=6,<7",
  "pystray>=0.19.5,<0.20",
  "Pillow>=11,<13",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.12,<7"]

[project.scripts]
workstate = "workstate.desktop:main"

[project.urls]
Homepage = "https://github.com/3plus10i/workstate"
Repository = "https://github.com/3plus10i/workstate"
Issues = "https://github.com/3plus10i/workstate/issues"

[tool.setuptools.packages.find]
include = ["workstate*"]

[tool.ruff]
target-version = "py311"
line-length = 100
