name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag, for example v4.0.0'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: 'requirements*.txt'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Check version and changelog
        run: python tools/release.py check --tag "$env:RELEASE_TAG"
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Test and build
        run: python build.py --release
      - name: Verify assets and prepare notes
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          python tools/release.py check-package "release/WorkState-$version-Windows.zip"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/release.py notes --output build/release-notes.md
      - name: Create draft with complete assets, then publish
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          gh release create "$env:RELEASE_TAG" "release/WorkState-$version-Windows.zip" release/SHA256SUMS.txt --draft --verify-tag --title "WorkState $version" --notes-file build/release-notes.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit "$env:RELEASE_TAG" --draft=false --latest
